version: '3.8'

services:
  # 1. Primary Relational Store with Row-Level Security
  postgres:
    image: postgres:16-alpine
    container_name: genericmed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/db/02_rls_policies.sql:/docker-entrypoint-initdb.d/02_rls_policies.sql
      - ./src/db/03_seed_data.sql:/docker-entrypoint-initdb.d/03_seed_data.sql
      - ./src/db/04_phase4_compliance.sql:/docker-entrypoint-initdb.d/04_phase4_compliance.sql
      - ./src/db/05_phase5_payments.sql:/docker-entrypoint-initdb.d/05_phase5_payments.sql
      - ./src/db/06_phase6_marketplace_iot.sql:/docker-entrypoint-initdb.d/06_phase6_marketplace_iot.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genericmed_admin -d genericmed"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Courier Telemetry Bus
  redis:
    image: redis:7.2-alpine
    container_name: genericmed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Medicine & Catalog Microservice (Go)
  catalog-service:
    build:
      context: ./src/services/catalog
      dockerfile: Dockerfile
    container_name: genericmed-catalog
    restart: unless-stopped
    environment:
      PORT: 8001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Prescription OCR & Verification Microservice (Python / FastAPI)
  ocr-service:
    build:
      context: ./src/services/ocr
      dockerfile: Dockerfile
    container_name: genericmed-ocr
    restart: unless-stopped
    environment:
      PORT: 8002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Order, Fulfillment & Express Dispatch Microservice (Node.js / Express)
  order-service:
    build:
      context: ./src/services/order
      dockerfile: Dockerfile
    container_name: genericmed-order
    restart: unless-stopped
    environment:
      PORT: 8003
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379
      PAYMENTS_MODE: ${PAYMENTS_MODE:-demo}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      CLEARINGHOUSE_MODE: ${CLEARINGHOUSE_MODE:-demo}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 6. FDA Orange Book nightly catalog ingestion. Run via a scheduler in production.
  fda-sync:
    build:
      context: ./src/services/fda-sync
      dockerfile: Dockerfile
    container_name: genericmed-fda-sync
    profiles: ["compliance-jobs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # 7. Unified API Gateway Reverse Proxy
  gateway:
    image: nginx:alpine
    container_name: genericmed-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./src/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-service
      - ocr-service
      - order-service

volumes:
  pgdata:
