events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/json;

    upstream catalog_upstream {
        server catalog-service:8001;
    }

    upstream ocr_upstream {
        server ocr-service:8002;
    }

    upstream order_upstream {
        server order-service:8003;
    }

    server {
        listen 8000;
        server_name localhost api.genericmed.health;

        # Cross-Origin Resource Sharing (CORS) Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Tenant-ID' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health Gateway Check
        location /health {
            return 200 '{"status":"UP","gateway":"Kong/Nginx Enterprise API Gateway","version":"1.2.0","timestamp":"$time_iso8601"}';
        }

        # Catalog Microservice Routes
        location /api/v1/catalog/ {
            proxy_pass http://catalog_upstream/api/v1/catalog/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Prescription OCR Microservice Routes
        location /api/v1/prescriptions/ {
            proxy_pass http://ocr_upstream/api/v1/prescriptions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 25M;
        }

        # Order & Dispatch Microservice Routes
        location /api/v1/orders/ {
            proxy_pass http://order_upstream/api/v1/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
